name: playkit-windows

# Builds *our own* mpv (this fork, with vf_playkit + vf vapoursynth) on Windows.
#
# Difference from shinchiro's mpv-winbuild: that ships a fully static binary,
# ours is the regular MSYS2 CLANG64 dynamic build - so the runtime DLL closure
# (ffmpeg, libplacebo, vapoursynth, python, ...) is flattened next to mpv.exe by
# scripts/package_windows.py and travels inside the zip. Result is still a
# self-contained folder: unzip anywhere and run mpv.exe, no MSYS2 required.
#
# Trigger:
#   - manual run
#   - any push to master: auto build, artifact only (no release)
#   - push a tag like playkit-2026.11.23: build + release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version string for the archive name (default: today, YYYY.MM.DD)"
        required: false
        default: ""
  push:
    branches:
      - master
    tags:
      - "playkit-*"

permissions:
  contents: write

# 连续推多个 commit 时只保留最后一次构建，避免排队等 5 分钟以上。
concurrency:
  group: playkit-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 (CLANG64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            base-devel
            git

      # Pulling the packaged mpv drags in the complete build dependency set
      # (ffmpeg, libplacebo, shaderc, spirv-cross, libass, luajit, zimg, ...)
      # with versions that are known to link together, instead of guessing a
      # hand-written package list. vapoursynth is added explicitly: vf_playkit
      # cannot frame-generate without the vapoursynth bridge.
      #
      # meson/ninja 必须用 CLANG64 版：MSYS 的 meson 由 /usr/bin/python3 执行，
      # 在 MinGW 环境里会报 "This python3 seems to be msys/python on MSYS2 Windows"
      # 并退出 2。（注意这里是折叠标量，别在命令中间插 #，会吞掉后半行。）
      - name: Install build dependencies
        run: >-
          pacman -S --needed --noconfirm
          mingw-w64-clang-x86_64-mpv
          mingw-w64-clang-x86_64-vapoursynth
          mingw-w64-clang-x86_64-clang
          mingw-w64-clang-x86_64-pkgconf
          mingw-w64-clang-x86_64-meson
          mingw-w64-clang-x86_64-ninja

      - name: Show toolchain versions
        run: |
          cc --version | head -1
          meson --version
          ninja --version
          pacman -Q mingw-w64-clang-x86_64-vapoursynth

      # Same options as E:\code\dlssg-vfi\build-mpv.sh. vapoursynth is pinned to
      # 'enabled' so a missing/broken package fails the build instead of
      # silently producing an mpv without vf vapoursynth.
      - name: Configure
        run: |
          meson setup build-msys \
            --prefix=/clang64 \
            -Dlibmpv=true \
            -Dd3d11=enabled \
            -Dvulkan=enabled \
            -Dshaderc=enabled \
            -Dvapoursynth=enabled

      - name: Compile
        run: meson compile -C build-msys

      - name: Smoke test (vf vapoursynth present)
        run: |
          ./build-msys/mpv.com --no-config --vf=help | grep -q vapoursynth
          ./build-msys/mpv.com --version

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}" -replace '^playkit-', ''
          } elseif ("${{ inputs.version }}") {
            $version = "${{ inputs.version }}"
          } else {
            $version = (Get-Date).ToString("yyyy.MM.dd")
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "version=$version"

      # 在 MSYS2 外壳里打包，python 自然是 CLANG64 的（pwsh 里的
      # C:\msys64\clang64\bin\python.exe 在 runner 上不一定存在）。
      - name: Package
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p dist
          python -V
          # CI 的 MSYS2 根目录不是 C:\msys64（setup-msys2 装在 D:\a\_temp\msys64），
          # 所以 bin 目录用 cygpath 现场换算，打包脚本要的是 Windows 路径。
          python scripts/package_windows.py \
            --build-dir build-msys \
            --msys-bin "$(cygpath -w /clang64/bin)" \
            --out "dist/mpv-x86_64-playkit-${VERSION}.zip" \
            --version "${VERSION}"
          ls -l dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mpv-x86_64-playkit-${{ steps.ver.outputs.version }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Create release (tag push only)
        if: startsWith(github.ref, 'refs/tags/playkit-')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: dist/*.zip
          generate_release_notes: true
          body: |
            Self-built mpv (this fork) with vf_playkit and vf vapoursynth.

            Unlike shinchiro's static mpv-winbuild, this is the MSYS2 CLANG64
            dynamic build with its DLL closure flattened into the archive root:
            unzip and run `mpv.exe` / `mpv.com`, no MSYS2 installation needed.
